name: Low-Power Catalog Auto-Sync

on:
  schedule:
    # Weekly low-power refresh: Sunday 18:00 UTC (Monday 03:00 JST)
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync DLsite catalog and recompute stats
        run: node scripts/sync-dlsite.mjs --write

      - name: Verify Astro static build
        run: npm run build

      - name: Commit and push updated data if changed
        run: |
          if git diff --quiet public/data/; then
            echo "No catalog data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/works.json public/data/upcoming.json public/data/stats.json
          git commit -m "chore(data): automated weekly DLsite catalog sync"
          git push
